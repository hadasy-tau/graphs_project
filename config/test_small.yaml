# Config for the end-to-end smoke test (tests/test_pipeline_smoke.py).
#
# Same shape as base.yaml, but every knob is scaled down so the whole pipeline
# runs in seconds on CPU with no large model downloads.
#
# Differences from base.yaml and WHY — read this before comparing numbers:
#   * embedding.model  — all-MiniLM-L6-v2 (~90MB, dim 384) instead of
#     bge-large-en-v1.5 (~1.3GB, dim 1024). Real semantics, tiny download.
#   * ner.model        — en_core_web_sm (~12MB) instead of en_core_web_lg.
#     Real spaCy NER, slightly noisier entity spans.
#   * semantic_graph.threshold — 0.40 instead of 0.5. MiniLM cosine
#     similarities on this corpus sit far lower than bge-large's (median 0.14,
#     99th pct 0.61), so 0.75 would produce an empty graph. 0.40 lands at
#     roughly the 95th percentile of pair similarities => a sparse but
#     non-empty graph, which is what the test needs to exercise.
#   * entity_graph.min_shared_entities — 1 instead of 2. With only 40 docs
#     there are few 2+ entity overlaps.
#
# These values are tuned to make the FLOW observable, not to reproduce the
# paper's numbers. Do not read experimental conclusions off this config.

embedding:
  model: "sentence-transformers/all-MiniLM-L6-v2"
  dim: 384
  batch_size: 32
  max_tokens: 512

ner:
  model: "en_core_web_sm"
  batch_size: 32
  keep_types: [PERSON, ORG, GPE, LOC, FAC, EVENT, PRODUCT]
  stop_entity_threshold: 0.20
  canonicalize_threshold: 0.85

entity_graph:
  min_shared_entities: 1

metadata_graph:
  date_window_days: 3

semantic_graph:
  threshold: 0.40
  mutual_knn_k: null   # null => derived from the entity graph's avg degree

pcst:
  topk: 3
  topk_e: 5
  cost_e: 0.5

dense_baseline:
  k: null   # null => calibrated to the entity-PCST average output size
