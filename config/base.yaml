embedding:
  model: "BAAI/bge-large-en-v1.5"
  query_prefix: "Represent this sentence for searching relevant passages: "
  dim: 1024
  batch_size: 64
  max_tokens: 512

ner:
  model: "en_core_web_lg"
  batch_size: 64
  keep_types: [PERSON, ORG, GPE, LOC, FAC, EVENT, PRODUCT]
  stop_entity_threshold: 0.20   # exclude entities in >20% of docs
  canonicalize_threshold: 0.90  # rapidfuzz ratio for merging near-duplicates

# Shared sparsifier for entity + metadata + semantic graphs.
# null  => entity uses min_shared_entities only; metadata and semantic k match
#          entity avg degree
# int   => all three graphs use this same mutual k-NN k (entity floor becomes
#          min_shared=1)
mutual_knn_k: null

entity_graph:
  min_shared_entities: 2

metadata_graph:
  fields: [title, author]

pcst:
  topk: 3
  topk_e: 5
  cost_e: 0.5

dense_baseline:
  k: null   # set automatically to match average PCST output size
